<select list="sects" align="right" id="section" name="section" onchange="nodes_list_update()">
<option selected value> -- выберите раздел -- </option>
    {% for sect in sects_list %}
      {% if sect.0 == sect_selected %}
        <option value="{{ sect.0 }}" selected> {{ sect.1 }} </option>
        {% else %}
        <option value="{{ sect.0 }}"> {{ sect.1 }} </option>
        {% endif %}
    {% endfor %}
</select>
