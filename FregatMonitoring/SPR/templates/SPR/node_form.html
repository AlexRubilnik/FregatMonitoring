<select list="nodes" align="right" id="node" name="node" onchange="last_operations_list_update()">
<option selected value> -- выберите узел -- </option>
    {% for node in nodes_list %}
      {% if node.0 == node_selected %}
        <option value="{{ node.0 }}" selected> {{ node.1 }} </option>
        {% else %}
        <option value="{{ node.0 }}"> {{ node.1 }} </option>
        {% endif %}
    {% endfor %}
</select>
